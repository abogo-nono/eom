name: Release

on:
  push:
    tags: ["v*"]
  # Every pull request builds the executables too: download them from the
  # run's "Artifacts" section to test a branch before it is merged.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A new push to a PR cancels its previous, now outdated, build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Linux ───────────────────────────────────────────────────────────────────
  # Build inside python:3.10-bullseye (Ubuntu 20.04, glibc 2.31) so the binary
  # runs on Ubuntu 20.04 / Debian 11 and any newer distro.
  build-linux:
    runs-on: ubuntu-latest
    container: python:3.10-bullseye
    steps:
      - name: Install git and Qt runtime deps
        run: |
          # Debian 11 left the main mirrors; its packages now live on archive.debian.org.
          sed -i -e 's|deb.debian.org/debian-security|archive.debian.org/debian-security|' \
                 -e 's|deb.debian.org/debian|archive.debian.org/debian|' \
                 -e '/bullseye-updates/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update -qq
          apt-get install -y --no-install-recommends \
            git binutils \
            libegl1 libxkbcommon0 libdbus-1-3 libgl1

      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        env:
          QT_QPA_PLATFORM: offscreen
        run: pyinstaller eom.spec --noconfirm --clean

      - name: Stage artifact
        run: |
          mkdir -p staging/eom-linux-x86_64
          cp dist/eom staging/eom-linux-x86_64/
          cp style.qss staging/eom-linux-x86_64/
          cp README.md staging/eom-linux-x86_64/

      - uses: actions/upload-artifact@v4
        with:
          name: eom-linux-x86_64
          path: staging/eom-linux-x86_64

  # ── Windows + macOS ─────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest = Windows Server 2022; binary runs on Windows 10+
          - os: windows-latest
            artifact: eom-windows-x86_64
            ext: ".exe"
          # macos-latest = Apple Silicon (arm64); runs on macOS 14+ (Sonoma)
          - os: macos-latest
            artifact: eom-macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Bundle exiftool (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # exiftool.org links the Windows package to SourceForge.
          $page = (Invoke-WebRequest -Uri 'https://exiftool.org/' -UseBasicParsing).Content
          if ($page -match 'exiftool-(\d+\.\d+)_64\.zip') { $ver = $Matches[1] } else { exit 1 }
          curl.exe -fsSL -o exiftool.zip "https://sourceforge.net/projects/exiftool/files/exiftool-${ver}_64.zip/download"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive exiftool.zip -DestinationPath et_tmp
          $dir = Get-ChildItem et_tmp -Directory | Select-Object -First 1
          Copy-Item (Get-ChildItem $dir.FullName -Filter *.exe | Select-Object -First 1).FullName exiftool.exe
          Copy-Item (Join-Path $dir.FullName 'exiftool_files') exiftool_files -Recurse
          .\exiftool.exe -ver

      - name: Generate macOS app icon (.icns)
        if: runner.os == 'macOS'
        run: python -c "from PIL import Image; img=Image.open('images/app-logo.ico'); img.save('images/app-logo.icns')"

      - name: Build with PyInstaller
        run: pyinstaller eom.spec --noconfirm --clean

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging/${{ matrix.artifact }}
          cp dist/eom${{ matrix.ext }} staging/${{ matrix.artifact }}/
          cp style.qss staging/${{ matrix.artifact }}/
          cp README.md staging/${{ matrix.artifact }}/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/${{ matrix.artifact }}

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    needs: [build-linux, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip per-OS artifacts
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$d" && zip -r "../${name}.zip" .)
          done

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: artifacts/*.zip
          generate_release_notes: true
