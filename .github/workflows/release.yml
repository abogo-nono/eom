name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Linux ───────────────────────────────────────────────────────────────────
  # Build inside python:3.10-bullseye (Ubuntu 20.04, glibc 2.31) so the binary
  # runs on Ubuntu 20.04 / Debian 11 and any newer distro.
  build-linux:
    runs-on: ubuntu-latest
    container: python:3.10-bullseye
    steps:
      - name: Install git and Qt runtime deps
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git binutils \
            libegl1 libxkbcommon0 libdbus-1-3 libgl1

      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        env:
          QT_QPA_PLATFORM: offscreen
        run: pyinstaller eom.spec --noconfirm --clean

      - name: Stage artifact
        run: |
          mkdir -p staging/eom-linux-x86_64
          cp dist/eom staging/eom-linux-x86_64/
          cp style.qss staging/eom-linux-x86_64/
          cp README.md staging/eom-linux-x86_64/

      - uses: actions/upload-artifact@v4
        with:
          name: eom-linux-x86_64
          path: staging/eom-linux-x86_64

  # ── Windows + macOS ─────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest = Windows Server 2022; binary runs on Windows 10+
          - os: windows-latest
            artifact: eom-windows-x86_64
            ext: ".exe"
          # macos-latest = Apple Silicon (arm64); runs on macOS 14+ (Sonoma)
          - os: macos-latest
            artifact: eom-macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Bundle exiftool (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $page = (Invoke-WebRequest -Uri 'https://exiftool.org/' -UseBasicParsing).Content
          if ($page -match 'exiftool-(\d+\.\d+)_64\.zip') { $ver = $Matches[1] } else { exit 1 }
          Invoke-WebRequest -Uri "https://exiftool.org/exiftool-${ver}_64.zip" -OutFile exiftool.zip
          Expand-Archive exiftool.zip -DestinationPath et_tmp
          Get-ChildItem et_tmp\*.exe | Select-Object -First 1 | Copy-Item -Destination exiftool.exe

      - name: Generate macOS app icon (.icns)
        if: runner.os == 'macOS'
        run: python -c "from PIL import Image; img=Image.open('images/app-logo.ico'); img.save('images/app-logo.icns')"

      - name: Build with PyInstaller
        run: pyinstaller eom.spec --noconfirm --clean

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging/${{ matrix.artifact }}
          cp dist/eom${{ matrix.ext }} staging/${{ matrix.artifact }}/
          cp style.qss staging/${{ matrix.artifact }}/
          cp README.md staging/${{ matrix.artifact }}/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/${{ matrix.artifact }}

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    needs: [build-linux, build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip per-OS artifacts
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$d" && zip -r "../${name}.zip" .)
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
