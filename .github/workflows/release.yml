name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: eom-linux-x86_64
            ext: ""
          - os: windows-latest
            artifact: eom-windows-x86_64
            ext: ".exe"
          - os: macos-latest
            artifact: eom-macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux Qt runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libgl1
      - run: pip install -r requirements-dev.txt
      - name: Build with PyInstaller
        run: pyinstaller eom.spec --noconfirm --clean
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging/${{ matrix.artifact }}
          cp dist/eom${{ matrix.ext }} staging/${{ matrix.artifact }}/
          cp style.qss staging/${{ matrix.artifact }}/
          cp README.md staging/${{ matrix.artifact }}/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip per-OS artifacts
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$d" && zip -r "../${name}.zip" .)
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
